<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened class="layout-sidenav bct-sidenav">
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>account_balance</mat-icon>
      </div>
      <div class="brand-text">
        <strong>BCT Portal</strong>
        <span>Cổng cán bộ nghiệp vụ</span>
      </div>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Danh sách hồ sơ</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="layout-hero">
      <div>
        <p class="hero-eyebrow">Bộ Công Thương</p>
        <h1>Cổng tiếp nhận &amp; xử lý hồ sơ</h1>
        <p class="hero-sub">Nhận hồ sơ từ NSW, phê duyệt và trả kết quả</p>
      </div>
      <div class="hero-badge">
        <mat-icon>sensors</mat-icon>
        Live
      </div>
    </header>
    <main class="layout-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
