<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened class="layout-sidenav nsw-sidenav">
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>anchor</mat-icon>
      </div>
      <div class="brand-text">
        <strong>NSW Portal</strong>
        <span>Cổng doanh nghiệp</span>
      </div>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/nop-ho-so" routerLinkActive="active">
        <mat-icon matListItemIcon>upload_file</mat-icon>
        <span matListItemTitle>Nộp hồ sơ</span>
      </a>
      <a mat-list-item routerLink="/tra-cuu" routerLinkActive="active">
        <mat-icon matListItemIcon>search</mat-icon>
        <span matListItemTitle>Tra cứu hồ sơ</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-icon>info</mat-icon>
      <span>Thủ tục 1 — Gửi hồ sơ &amp; nhận kết quả</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="layout-hero">
      <div>
        <p class="hero-eyebrow">National Single Window</p>
        <h1>Hệ thống một cửa quốc gia</h1>
        <p class="hero-sub">Nộp hồ sơ, theo dõi trạng thái realtime qua WebSocket</p>
      </div>
      <div class="hero-badge">
        <mat-icon>sensors</mat-icon>
        Live
      </div>
    </header>
    <main class="layout-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
